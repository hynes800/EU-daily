name: eu-daily
on:
  schedule:
    - cron: "0 6 * * 1-5"   # UTC 06:00 ≈ Brussels 08:00（夏令时）
  workflow_dispatch:        # 手动触发不做时间检查，方便测试

permissions:
  contents: write           # 允许发布 gh-pages 分支

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build and send
        run: python main.py ${{ github.event_name == 'schedule' && '--check-time' || '' }} --send
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_USER: wednet800@163.com
          MAIL_FROM: wednet800@163.com
          MAIL_TO: hynes800@gmail.com
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
