name: eu-daily
on:
  schedule:
    - cron: "0 6 * * 1-5"   # UTC 06:00 ≈ Brussels 08:00（夏令时）
  workflow_dispatch:        # 手动触发不做时间检查，方便测试

permissions:
  contents: write           # 允许发布 gh-pages 分支

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # 拉取 gh-pages 上已有的历史存档，避免被覆盖丢失
      - name: Restore archive from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 || true
          mkdir -p public
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout origin/gh-pages -- archive && mv archive public/archive || true
          fi

      - name: Build and send
        run: python main.py ${{ github.event_name == 'schedule' && '--check-time' || '' }} --send
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_USER: wednet800@163.com
          MAIL_FROM: wednet800@163.com
          MAIL_TO: hynes800@gmail.com
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 可选：配置后标题/摘要自动转中文；不配置则显示原文
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: false
          keep_files: true      # 保留历史 archive
