name: eu-daily
on:
  schedule:
    - cron: "0 6 * * 1-5"   # UTC 06:00 ≈ Brussels 08:00（夏令时）；脚本内二次校验本地时间
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py --check-time --send
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_USER: wednet800@163.com
          MAIL_FROM: wednet800@163.com
          MAIL_TO: hynes800@gmail.com
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
